name: Build PobedaRadar APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        run: gradle assembleRelease

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk PobedaRadar-v0.15.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PobedaRadar-v0.15
          path: PobedaRadar-v0.15.apk
          if-no-files-found: error
          retention-days: 30
