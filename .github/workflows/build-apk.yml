name: Build PobedaRadar APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pobedaradar-permanent-debug-key-v1

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PobedaRadar-v0.12.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PobedaRadar-v0.12
          path: PobedaRadar-v0.12.apk
          if-no-files-found: error
          retention-days: 30
