name: Build PobedaRadar APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create permanent signing key
        run: |
          echo "/u3+7QAAAAIAAAABAAAAAQALcG9iZWRhcmFkYXIAAAGgUo1aCgAABP4wggT6MAwGCisGAQQBKgIRAQEEggToiDT0w55ozGg6uGMO" > key.txt
